version: 0.1

# ── Contoso Traders — Agentic STLC HyperExecute Config (NATIVE Playwright/TS) ──
#
# Runs the repo's native TypeScript Playwright suite at scale on LambdaTest.
#   • The Contoso app + the HyperExecute global tunnel run on the GitHub Actions
#     RUNNER (the orchestrate job starts the app before agent.py invokes the HE CLI).
#   • tunnel: true → the HE CLI provisions a NAT tunnel from the runner; tunnelOpts
#     keeps it global across stages so every cloud browser reaches the runner's
#     localhost:3000. lambda.setup.ts sets tunnel:true + tunnelName in the caps.
#   • Each spec file fans out to its own VM, which runs `npx playwright test`
#     against the LambdaTest cloud browser (project chrome:108:Windows10@lambdatest).

runson: linux

# Tunnel is started MANUALLY on the runner (orchestrate job) with a known name
# and referenced by name in the Playwright caps (lambda.setup.ts) — the same
# model proven working for Kane Stage 1. We do NOT use HE's auto tunnel:true,
# which did not bind the native-Playwright cloud sessions (every test died at
# "start the browser"). The named tunnel is account-global: any LT cloud session
# with tunnelName=<name> routes to the runner's tunnel → the runner's app.

globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 5

env:
  LT_USERNAME:       ${LT_USERNAME}
  LT_ACCESS_KEY:     ${LT_ACCESS_KEY}
  GITHUB_RUN_NUMBER: ${GITHUB_RUN_NUMBER}
  CI: "true"
  # Name of the LT tunnel started on the runner (orchestrate job). Substituted
  # from the orchestrate job's env at submit time and injected into each VM, so
  # lambda.setup.ts sets caps tunnelName to this and the cloud browser routes to
  # the runner's app via that tunnel.
  LT_TUNNEL_NAME:    ${LT_TUNNEL_NAME}

runtime:
  language: node
  version: "18"

cacheKey: '{{ checksum "src/ContosoTraders.Ui.Website/package-lock.json" }}'
cacheDirectories:
  - src/ContosoTraders.Ui.Website/node_modules

pre:
  - cd src/ContosoTraders.Ui.Website && npm install --no-audit --no-fund
  - cd src/ContosoTraders.Ui.Website && npx playwright install chromium

# Enumerate the native spec files (one HE task per spec). Paths are relative to
# the UI dir so they pass cleanly to the runner command below.
testDiscovery:
  type: raw
  mode: dynamic
  command: cd src/ContosoTraders.Ui.Website && ls tests/*.spec.ts

# Run each spec on the LambdaTest cloud browser via the tunnel. JUnit is written
# under the UI dir's results folder and collected as an artifact.
testRunnerCommand: cd src/ContosoTraders.Ui.Website && npx playwright test $test --project="chrome:108:Windows10@lambdatest"

mergeArtifacts: true
uploadArtefacts:
  - name: PlaywrightReport
    path:
      - src/ContosoTraders.Ui.Website/playwright-report/**
      - src/ContosoTraders.Ui.Website/test-results/**

report: true
partialReports:
  frameworkName: playwright
  type: html
  location: src/ContosoTraders.Ui.Website/playwright-report

post:
  - echo "Native Playwright HyperExecute run complete"

jobLabel:
  - contoso-traders
  - agentic-stlc
  - playwright
  - typescript
