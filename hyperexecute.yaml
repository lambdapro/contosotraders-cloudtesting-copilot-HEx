version: 0.1

# ── Contoso Traders — Agentic STLC HyperExecute Config ────────────────────────
#
# The Contoso app + HyperExecute global tunnel run on the GitHub Actions RUNNER
# (the app launches reliably there — not inside an HE VM). With tunnel: true the
# HE CLI (running on the runner) creates the tunnel; tunnelOpts.global keeps it
# active across all execution stages so every cloud browser, across all parallel
# tasks, reaches the runner's localhost:3000. conftest.py connects the cloud
# browser via CDP with tunnel:true.

runson: linux

# ── Tunnel configuration ──────────────────────────────────────────────────────
tunnel: true
tunnelOpts:
  global: true                # keep the tunnel active across all execution stages
  checkTunnelOnFailure: true  # auto-recover the tunnel if it drops

globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 10

env:
  LT_USERNAME:        ${LT_USERNAME}
  LT_ACCESS_KEY:      ${LT_ACCESS_KEY}
  GITHUB_RUN_NUMBER:  ${GITHUB_RUN_NUMBER}
  TARGET_URL:         "http://localhost:3000"
  BROWSERS:           "chrome"
  # Tells conftest.py to set tunnel:true in the CDP capabilities (the global HE
  # tunnel has no per-VM name to inject, so this flag enables it explicitly).
  HE_TUNNEL:          "true"

cacheKey: '{{ checksum "requirements.txt" }}'
cacheDirectories:
  - .pip_cache
  - ~/.cache/ms-playwright

# pre: installs Python deps only. No app launch in the VM (the app runs on the
# runner) and no local browser install (tests use the LambdaTest cloud browser).
pre:
  - mkdir -p reports
  - pip install --cache-dir .pip_cache -r requirements.txt -q

runtime:
  language: python
  version: "3.11"

# Stage 4 (write_test_selection in agent.py) writes one pytest node ID per line.
# HyperExecute reads this file and fans each node out to a separate VM.
testDiscovery:
  type: raw
  mode: dynamic
  command: cat reports/pytest_selection.txt

# Plain pytest — conftest.py handles the LambdaTest cloud connection + tunnel.
testRunnerCommand: PYTHONPATH=. pytest "$test" -v --tb=short -s --html=reports/report.html --junitxml=reports/junit.xml

mergeArtifacts: true

uploadArtefacts:
  - name: ContosoPipelineReports
    path:
      - reports/

report: true
partialReports:
  type: json
  location: reports/
  frameworkName: extent

post:
  - echo "HyperExecute Contoso Traders tests complete"

jobLabel:
  - contoso-traders
  - agentic-stlc
  - playwright
  - python
