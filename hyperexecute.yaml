version: 0.1

# ── Contoso Traders — Agentic STLC HyperExecute Config (NATIVE Playwright/TS) ──
#
# Runs the repo's native TypeScript Playwright suite at scale on LambdaTest.
# Each spec file fans out to its own VM, which runs `npx playwright test` against a
# LambdaTest cloud browser (project chrome:108:Windows10@lambdatest).
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ KNOWN LIMITATION — HE CANNOT REACH A RUNNER-LOCAL APP (localhost:3000)        │
# │                                                                              │
# │ The cloud Playwright session (wss://cdp.lambdatest.com/playwright) is        │
# │ initiated from the HE VM — a separate US-EAST-1 cloud machine, NOT the GHA   │
# │ runner. It cannot bind a tunnel to reach the app on the runner's localhost:  │
# │   • HE-managed global tunnel (tunnel:true) → grid closes session at          │
# │     chromium.connect(): "browser has been closed".                           │
# │   • Named runner tunnel (Kane model, LT_TUNNEL_NAME propagated to caps —     │
# │     verified) → connect 400: "either tunnel is not running or disconnected". │
# │   • tunnel:false against a PUBLIC url → connect() SUCCEEDS (isolation test).  │
# │                                                                              │
# │ Kane (Stage 1) works against localhost because it runs ON the runner next to │
# │ its own named tunnel. HyperExecute does not have that locality.              │
# │                                                                              │
# │ TO RUN HE AT SCALE: deploy the app to a PUBLIC URL and set                   │
# │   REACT_APP_BASEURLFORPLAYWRIGHTTESTING=<public-url>                          │
# │ (lambda.setup.ts uses it as baseURL) with NO tunnel. For a localhost-only    │
# │ app state (e.g. the Memorial Day banner), rely on Kane Stage 1 for the       │
# │ functional verdict; HE regression requires a reachable public target.        │
# └─────────────────────────────────────────────────────────────────────────────┘

runson: linux

# Named runner tunnel is still started by the orchestrate step and propagated as
# LT_TUNNEL_NAME (caps tunnelName), but per the limitation above it does NOT let
# HE-VM cloud sessions reach localhost. Kept only so a future PUBLIC-URL run needs
# no further wiring. We deliberately do NOT use HE-managed `tunnel: true`.

globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 5

env:
  LT_USERNAME:       ${LT_USERNAME}
  LT_ACCESS_KEY:     ${LT_ACCESS_KEY}
  GITHUB_RUN_NUMBER: ${GITHUB_RUN_NUMBER}
  CI: "true"
  # Name of the runner-started LambdaTest tunnel (exported by the orchestrate step).
  # HE expands ${LT_TUNNEL_NAME} from the CLI's host env at submit and injects it
  # into every VM; lambda.setup.ts reads it and sets caps tunnel:true + tunnelName
  # so the cloud Playwright browser routes back to the runner's localhost:3000.
  LT_TUNNEL_NAME: ${LT_TUNNEL_NAME}

runtime:
  language: node
  version: "18"

cacheKey: '{{ checksum "src/ContosoTraders.Ui.Website/package-lock.json" }}'
cacheDirectories:
  - src/ContosoTraders.Ui.Website/node_modules

pre:
  - cd src/ContosoTraders.Ui.Website && npm install --no-audit --no-fund
  - cd src/ContosoTraders.Ui.Website && npx playwright install chromium

# Enumerate the native spec files (one HE task per spec). Paths are relative to
# the UI dir so they pass cleanly to the runner command below.
testDiscovery:
  type: raw
  mode: dynamic
  command: cd src/ContosoTraders.Ui.Website && ls tests/*.spec.ts

# Run each spec on the LambdaTest cloud browser via the tunnel. JUnit is written
# under the UI dir's results folder and collected as an artifact.
testRunnerCommand: cd src/ContosoTraders.Ui.Website && npx playwright test $test --project="chrome:108:Windows10@lambdatest"

mergeArtifacts: true
uploadArtefacts:
  - name: PlaywrightReport
    path:
      - src/ContosoTraders.Ui.Website/playwright-report/**
      - src/ContosoTraders.Ui.Website/test-results/**

report: true
partialReports:
  frameworkName: playwright
  type: html
  location: src/ContosoTraders.Ui.Website/playwright-report

post:
  - echo "Native Playwright HyperExecute run complete"

jobLabel:
  - contoso-traders
  - agentic-stlc
  - playwright
  - typescript
