version: "0.1"

# ── Contoso Traders — Agentic STLC HyperExecute (browser MATRIX) ──────────────
#
# Matrix execution: os × browser × test_files. Kane AI exports its regression
# specs (Stage 3) into src/ContosoTraders.Ui.Website/regression/*.test.js, and the
# glob below runs them across the browser matrix. The Contoso app is started on the
# VM in `pre` (npm start) and exposed to the LambdaTest cloud browser via tunnel.
#
# NOTE: the UI lives under src/ContosoTraders.Ui.Website, so commands cd into it and
# the test_files glob is relative to that directory (where node_modules + the
# Playwright config live).

retryOnFailure: true
maxRetries: 3
concurrency: 24

matrix:
  os: [win, linux]
  # LambdaTest cloud browser projects (defined in playwright.config.ts). Passed as
  # --project=$browser; lambda.setup.ts connects each to the cdp.lambdatest.com
  # cloud grid and reaches the pre-started app on the VM via tunnel: true.
  browser:
    - "MicrosoftEdge:latest:Windows10@lambdatest"
    - "chrome:108:Windows10@lambdatest"
    - "pw-firefox:latest@lambdatest"
  # Kane-exported regression specs (see ci/export_kane_regression.py). The glob is
  # resolved at run time, so whatever Kane exports into regression/ is executed.
  test_files:
    - "regression/*.test.js"

runson: ${matrix.os}

tunnel: true

mergeArtifacts: true
report: true
partialReports:
  frameworkName: playwright
  location: src/ContosoTraders.Ui.Website/playwright-report
  type: html
  email:
    to:
      - mudassars@lambdatest.com

cacheKey: '{{ checksum "src/ContosoTraders.Ui.Website/package-lock.json" }}'
cacheDirectories:
  - src/ContosoTraders.Ui.Website/node_modules

pre:
  - cd src/ContosoTraders.Ui.Website && npm install
  - cd src/ContosoTraders.Ui.Website && npx playwright install
  # Start the app on the VM's localhost:3000 (backgrounded) and wait until it
  # responds, so the cloud browser reaches it through the tunnel during the tests.
  - cd src/ContosoTraders.Ui.Website && (BROWSER=none npm start > app-start.log 2>&1 &) && npx --yes wait-on http://localhost:3000 -t 120000

testSuites:
  - cd src/ContosoTraders.Ui.Website && npx playwright test $test_files --project=$browser
