version: "0.1"

# ── Contoso Traders — Agentic STLC HyperExecute (Kane testmu Python exports) ──
#
# Runs the Python `testmu` scripts Kane AI exports (regression/*.py) at scale.
# kane-cli only emits Python (--code-language javascript is a no-op), so each
# export is `python <file>`: testmu.run launches a LOCAL Playwright browser on the
# VM against the app started in `pre`, and calls Kane's AI vision API for the
# assertions (consumes Kane AI credits per run).
#
# matrix.files is AUTO-GENERATED before submit by ci/build_he_matrix.py from the
# Kane-exported src/ContosoTraders.Ui.Website/regression/*.py.

runson: linux

retryOnFailure: true
maxRetries: 3
concurrency: 24

matrix:
  files:
    - src/ContosoTraders.Ui.Website/regression/_placeholder.py

env:
  LT_USERNAME:        ${LT_USERNAME}
  LT_ACCESS_KEY:      ${LT_ACCESS_KEY}
  TESTMU_SMART:       "1"
  TESTMU_HEADLESS:    "true"
  TESTMU_AI_API_HOST: "https://kaneai-api.lambdatest.com/v16-server"

cacheKey: '{{ checksum "requirement.txt" }}'
cacheDirectories:
  - CacheDir

pre:
  # App on the VM's localhost:3000 — testmu launches a local browser that hits it.
  - cd src/ContosoTraders.Ui.Website && npm install
  # Start the dev server, wait up to 240s; on timeout dump app-start.log so the
  # failure is visible in the stage log instead of a bare wait-on timeout.
  - cd src/ContosoTraders.Ui.Website && (BROWSER=none npm start > app-start.log 2>&1 &) && (npx --yes wait-on http://localhost:3000 -t 240000 || (echo "===== app-start.log ====="; cat app-start.log; exit 1))
  # testmu runtime + Playwright for the Kane exports.
  - pip3 install -r requirement.txt --cache-dir CacheDir
  - playwright install

testSuites:
  - python $files

mergeArtifacts: true
report: true
partialReports:
  frameworkName: playwright
  location: src/ContosoTraders.Ui.Website/playwright-report
  type: html
  email:
    to:
      - mudassars@lambdatest.com
